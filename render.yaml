databases:
  - name: hook-talent-db
    plan: free

services:
  - type: web
    name: hook-talent-pipeline
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt && flask db upgrade
    startCommand: gunicorn wsgi:application -c gunicorn.conf.py
    healthCheckPath: /health
    envVars:
      - key: AMPLEMARKET_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: PROXYCURL_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hook-talent-db
          property: connectionString
      - key: FLASK_APP
        value: app:create_app
      - key: PYTHON_VERSION
        value: "3.12"
