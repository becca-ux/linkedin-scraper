databases:
  - name: hook-talent-db
    plan: starter

services:
  - type: web
    name: hook-talent-pipeline
    runtime: python
    buildCommand: pip install -r requirements.txt && flask db upgrade
    startCommand: gunicorn wsgi:application
    healthCheckPath: /health
    envVars:
      - key: AMPLEMARKET_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hook-talent-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12"
