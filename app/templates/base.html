<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Candidate Sourcing{% endblock %} — Hook Talent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(170deg, #7d5a6e 0%, #4a3a5c 20%, #2a2550 40%, #1a1a3e 65%, #13132e 100%);
            color: #e8e0d8;
            line-height: 1.6;
            min-height: 100vh;
        }
        h1, h2, h3, .page-heading {
            font-family: 'DM Serif Display', Georgia, serif;
            color: #f5efe6;
            font-weight: 400;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

        /* Navigation */
        nav {
            background: rgba(18, 18, 40, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 16px 0;
        }
        nav .container { display: flex; align-items: center; justify-content: space-between; }
        nav .logo {
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.3px;
            text-decoration: none;
        }
        nav .logo span { opacity: 0.5; font-weight: 400; margin-left: 6px; }
        nav .nav-links { display: flex; gap: 24px; }
        nav a { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 14px; transition: color 0.2s; }
        nav a:hover { color: #fff; }

        /* Cards */
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 24px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }
        .card h2 { margin-bottom: 16px; font-size: 20px; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            padding: 12px 16px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.35);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-family: 'Inter', sans-serif;
        }
        td {
            padding: 12px 16px;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
            color: #e8e0d8;
        }
        tr:hover td { background: rgba(255,255,255,0.03); }

        /* Score badges */
        .score-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 13px; }
        .score-high { background: rgba(183,130,120,0.25); color: #e8b4a8; border: 1px solid rgba(183,130,120,0.3); }
        .score-mid { background: rgba(200,180,140,0.2); color: #d4c8a0; border: 1px solid rgba(200,180,140,0.25); }
        .score-low { background: rgba(140,120,160,0.2); color: #a898b8; border: 1px solid rgba(140,120,160,0.25); }

        /* Filters */
        .filters { display: flex; gap: 12px; margin: 20px 0; flex-wrap: wrap; }
        .filters select, .filters input {
            padding: 8px 14px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            font-size: 14px;
            background: rgba(255,255,255,0.06);
            color: #e8e0d8;
            font-family: 'Inter', sans-serif;
        }
        .filters select option { background: #1a1a3e; color: #e8e0d8; }
        .filters button {
            padding: 8px 20px;
            background: transparent;
            color: #d4a8a0;
            border: 1px solid rgba(212,168,160,0.4);
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .filters button:hover { background: rgba(212,168,160,0.12); border-color: rgba(212,168,160,0.6); }

        /* Buttons */
        .btn-primary {
            padding: 10px 24px;
            background: transparent;
            color: #d4a8a0;
            border: 1px solid rgba(212,168,160,0.4);
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .btn-primary:hover { background: rgba(212,168,160,0.12); border-color: rgba(212,168,160,0.6); }
        .btn-secondary {
            padding: 10px 24px;
            background: transparent;
            color: rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.25); }

        /* Form elements */
        select, input[type="text"], input[type="number"], textarea {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            color: #e8e0d8;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            padding: 8px 14px;
        }
        select option { background: #1a1a3e; color: #e8e0d8; }
        select:focus, input:focus, textarea:focus { outline: none; border-color: rgba(212,168,160,0.5); }
        ::placeholder { color: rgba(255,255,255,0.25); }
        label { color: rgba(255,255,255,0.45); }

        /* Links */
        a { color: #d4a8a0; text-decoration: none; transition: color 0.2s; }
        a:hover { color: #e8c4bc; text-decoration: none; }

        /* Sidebar */
        .sidebar-section { margin-bottom: 20px; }
        .sidebar-section h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.35);
            margin-bottom: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
        }

        .back-link { display: inline-block; margin-bottom: 16px; color: #d4a8a0; text-decoration: none; font-size: 14px; }
        .outreach-box {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 16px;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.7;
            color: #d8d0c8;
        }

        .empty-state { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.4); }
        .empty-state h2 { color: #f5efe6; margin-bottom: 8px; }

        /* Muted text */
        .muted { color: rgba(255,255,255,0.4); }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="/" class="logo">hook<span>talent</span></a>
            <div class="nav-links">
                <a href="/">Dashboard</a>
                <a href="/auto-source">Auto Source</a>
                <a href="/search">Score Candidate</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
